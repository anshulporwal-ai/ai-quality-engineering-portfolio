<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Passing deterministic AI quality gates</title>
  <desc id="desc">Terminal-style evidence showing three passing AI-response quality tests for secret disclosure, hallucinated absolute claims, and grounded safe concise responses.</desc>
  <rect width="1200" height="520" rx="24" fill="#07111f"/>
  <rect x="1" y="1" width="1198" height="518" rx="23" fill="none" stroke="#24364f" stroke-width="2"/>
  <circle cx="38" cy="34" r="8" fill="#ff5f57"/>
  <circle cx="64" cy="34" r="8" fill="#febc2e"/>
  <circle cx="90" cy="34" r="8" fill="#28c840"/>
  <text x="600" y="41" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="18" fill="#94a3b8">AI quality gates — Playwright</text>
  <line x1="0" y1="64" x2="1200" y2="64" stroke="#24364f"/>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="21">
    <text x="38" y="112" fill="#7dd3fc">$ npm run test:ai</text>
    <text x="38" y="158" fill="#cbd5e1">Running 3 deterministic AI-response checks</text>
    <text x="38" y="218" fill="#4ade80">✓</text>
    <text x="72" y="218" fill="#e2e8f0">flags potential secret disclosure</text>
    <text x="38" y="270" fill="#4ade80">✓</text>
    <text x="72" y="270" fill="#e2e8f0">rejects hallucinated absolute claims</text>
    <text x="38" y="322" fill="#4ade80">✓</text>
    <text x="72" y="322" fill="#e2e8f0">accepts a grounded, safe and concise response</text>
    <text x="38" y="398" fill="#4ade80" font-weight="700">3 passed</text>
    <text x="38" y="454" fill="#64748b" font-size="17">Representative local execution · synthetic responses · no external AI API required</text>
  </g>
</svg>
