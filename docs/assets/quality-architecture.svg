<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">AI Quality Engineering portfolio architecture</title>
  <desc id="desc">A code change flows through GitHub Actions into UI, API, accessibility, and AI quality test layers, producing test evidence and a release decision.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07152f"/>
      <stop offset="1" stop-color="#0b2f55"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#020617" flood-opacity="0.38"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#29d3e2"/>
    </marker>
    <style>
      .label { font: 700 24px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill:#f8fafc }
      .small { font: 500 17px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill:#bfdbfe }
      .node { fill:#0f2747; stroke:#2389da; stroke-width:2; rx:18; filter:url(#shadow) }
      .gate { fill:#0c3c4a; stroke:#29d3e2; stroke-width:2.5; rx:18; filter:url(#shadow) }
      .line { fill:none; stroke:#29d3e2; stroke-width:3; marker-end:url(#arrow) }
    </style>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1050" cy="90" r="170" fill="#0ea5e9" opacity="0.08"/>
  <circle cx="130" cy="580" r="210" fill="#22d3ee" opacity="0.06"/>

  <text x="600" y="62" text-anchor="middle" class="label" font-size="32">AI Quality Engineering — Automated Quality Gates</text>
  <text x="600" y="92" text-anchor="middle" class="small">Playwright · TypeScript · GitHub Actions · Deterministic AI Evaluation</text>

  <rect class="node" x="55" y="260" width="190" height="105"/>
  <text x="150" y="305" text-anchor="middle" class="label">Code change</text>
  <text x="150" y="337" text-anchor="middle" class="small">Push or pull request</text>

  <rect class="gate" x="300" y="260" width="200" height="105"/>
  <text x="400" y="305" text-anchor="middle" class="label">GitHub Actions</text>
  <text x="400" y="337" text-anchor="middle" class="small">Parallel quality gate</text>

  <rect class="node" x="565" y="130" width="205" height="80"/>
  <text x="668" y="169" text-anchor="middle" class="label">UI journeys</text>
  <text x="668" y="193" text-anchor="middle" class="small">Page objects</text>
  <rect class="node" x="565" y="230" width="205" height="80"/>
  <text x="668" y="269" text-anchor="middle" class="label">API contracts</text>
  <text x="668" y="293" text-anchor="middle" class="small">Positive + negative</text>
  <rect class="node" x="565" y="330" width="205" height="80"/>
  <text x="668" y="369" text-anchor="middle" class="label">Accessibility</text>
  <text x="668" y="393" text-anchor="middle" class="small">axe-core checks</text>
  <rect class="node" x="565" y="430" width="205" height="80"/>
  <text x="668" y="469" text-anchor="middle" class="label">AI quality</text>
  <text x="668" y="493" text-anchor="middle" class="small">Grounding + safety</text>

  <rect class="gate" x="835" y="215" width="185" height="105"/>
  <text x="928" y="259" text-anchor="middle" class="label">Evidence</text>
  <text x="928" y="291" text-anchor="middle" class="small">HTML · JUnit · traces</text>
  <rect class="gate" x="835" y="365" width="185" height="105"/>
  <text x="928" y="409" text-anchor="middle" class="label">Decision</text>
  <text x="928" y="441" text-anchor="middle" class="small">Pass or investigate</text>

  <path class="line" d="M245 313 H300"/>
  <path class="line" d="M500 313 C535 313 530 170 565 170"/>
  <path class="line" d="M500 313 C535 313 530 270 565 270"/>
  <path class="line" d="M500 313 C535 313 530 370 565 370"/>
  <path class="line" d="M500 313 C535 313 530 470 565 470"/>
  <path class="line" d="M770 170 C810 170 805 255 835 255"/>
  <path class="line" d="M770 270 H835"/>
  <path class="line" d="M770 370 C810 370 805 290 835 290"/>
  <path class="line" d="M770 470 C810 470 805 420 835 420"/>
  <path class="line" d="M928 320 V365"/>

  <text x="600" y="584" text-anchor="middle" class="small">Original public demonstration using synthetic data and public services — no employer or client code</text>
</svg>
